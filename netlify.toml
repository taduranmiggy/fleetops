[build]
  base = "frontend"
  command = "npm ci --include=dev && npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "20"
  # Temporary production fallback while Render's public subdomain is returning
  # x-render-routing: no-server before FastAPI receives requests.
  NEXT_PUBLIC_API_URL = "https://fleetops-production-b2b7.up.railway.app/api"
  BACKEND_ORIGIN = "https://fleetops-production-b2b7.up.railway.app"

[[redirects]]
  from = "/api-proxy/*"
  to = "https://fleetops-production-b2b7.up.railway.app/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/uploads/*"
  to = "https://fleetops-production-b2b7.up.railway.app/uploads/:splat"
  status = 200
  force = true
