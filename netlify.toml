[build]
  base = "frontend"
  command = "npm ci --include=dev && npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "20"
  # Keep browser API requests same-origin; Netlify proxies them to Render.
  NEXT_PUBLIC_API_URL = "/api-proxy"
  BACKEND_ORIGIN = "https://fleetops-fijg.onrender.com"

[[redirects]]
  from = "/api-proxy/*"
  to = "https://fleetops-fijg.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/uploads/*"
  to = "https://fleetops-fijg.onrender.com/uploads/:splat"
  status = 200
  force = true
