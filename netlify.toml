[build]
  base = "frontend"
  command = "npm ci --include=dev && npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "20"
  # Keep browser requests same-origin; the Next.js route proxies them to the API.
  NEXT_PUBLIC_API_URL = "/api-proxy"
