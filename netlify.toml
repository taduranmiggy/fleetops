[build]
  base = "frontend"
  command = "npm ci --include=dev && npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "20"
  # Render's public API is reachable in browsers, but Netlify's edge cannot
  # currently route to it. Use the API directly and rely on the API CORS allowlist.
  NEXT_PUBLIC_API_URL = "https://fleetops-fijg.onrender.com/api"
  BACKEND_ORIGIN = "https://fleetops-fijg.onrender.com"

[[redirects]]
  from = "/api-proxy/*"
  to = "https://fleetops-fijg.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/uploads/*"
  to = "https://fleetops-fijg.onrender.com/uploads/:splat"
  status = 200
  force = true
